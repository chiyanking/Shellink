[package]
name = "shellink-desktop"
version = "0.2.4"
description = "Shellink desktop terminal workspace"
authors = ["Shellink contributors"]
license = "MIT"
edition = "2024"

[lib]
name = "shellink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
